services:
  wallos:
    build: .
    image: wallos-dial:0.1.0
    container_name: wallos-dial
    ports:
      - "127.0.0.1:8282:80"
    environment:
      TZ: UTC
      # WALLOS_DIAL_LOGO_MAP: /var/www/html/includes/dial_logo_map.local.php
    volumes:
      - ./data/db:/var/www/html/db
      - ./data/logos:/var/www/html/images/uploads/logos
      # - ./config/logo-map.local.php:/var/www/html/includes/dial_logo_map.local.php:ro
    restart: unless-stopped
