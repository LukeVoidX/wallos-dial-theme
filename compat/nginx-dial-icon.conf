location ^~ /images/uploads/logos/.dial-stage- {
    return 404;
}

location = /images/uploads/logos/.dial-logo-cleanup-retry.jsonl {
    return 404;
}

location = /endpoints/dial/icons.php {
    client_max_body_size 3M;
    root /var/www/html;
    fastcgi_pass 127.0.0.1:9000;
    fastcgi_index index.php;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
}
