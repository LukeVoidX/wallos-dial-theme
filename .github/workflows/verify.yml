name: Verify theme
on:
  push:
  pull_request:

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package
        run: ./scripts/check-package.sh
      - name: Validate Compose files
        run: docker compose config -q && docker compose -f compose.build.yaml config -q
      - name: Build pinned Wallos image
        run: docker build -t wallos-dial:ci .
      - name: Lint PHP overlay
        run: |
          docker run --rm --entrypoint sh wallos-dial:ci -lc '
            for file in /var/www/html/index.php /var/www/html/subscriptions.php /var/www/html/calendar.php /var/www/html/stats.php /var/www/html/includes/header.php /var/www/html/includes/dial_logo_map.php /var/www/html/includes/dial_dashboard.php /var/www/html/includes/dial_stat_money.php /var/www/html/includes/list_subscriptions.php /var/www/html/endpoints/subscriptions/get.php /var/www/html/endpoints/user/set_dial_language.php; do
              php -l "$file" || exit 1
            done
          '
      - name: Smoke test runtime
        run: ./scripts/smoke-image.sh wallos-dial:ci
