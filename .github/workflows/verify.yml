name: Verify theme
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify complete local Dial candidate
        run: ./scripts/verify-1.0-candidate.sh wallos-dial:ci
