name: Check Wallos releases
on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare latest upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' https://api.github.com/repos/ellite/Wallos/releases/latest | jq -r '.tag_name')
          tested="v$(cat WALLOS_VERSION)"
          if [ "$latest" != "$tested" ]; then
            echo "::warning::Wallos $latest is available; Dial is verified for $tested. Review and test before releasing a new image."
            exit 1
          fi
          echo "Dial is current with upstream $tested."
