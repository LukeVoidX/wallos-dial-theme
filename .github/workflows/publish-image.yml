name: Publish versioned container
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match tag and declared version
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          ./scripts/check-package.sh
          docker compose config -q
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and smoke test before publication
        run: |
          docker build -t wallos-dial:preflight .
          ./scripts/smoke-image.sh wallos-dial:preflight
          docker run --rm --entrypoint sh wallos-dial:preflight -lc '
            for file in /var/www/html/index.php /var/www/html/subscriptions.php /var/www/html/calendar.php /var/www/html/stats.php /var/www/html/includes/header.php /var/www/html/includes/dial_logo_map.php /var/www/html/includes/dial_dashboard.php /var/www/html/includes/dial_stat_money.php /var/www/html/includes/list_subscriptions.php /var/www/html/endpoints/subscriptions/get.php /var/www/html/endpoints/user/set_dial_language.php; do
              php -l "$file" >/dev/null || exit 1
            done
          '
      - name: Resolve version tag
        id: image
        run: echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push tested version
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lukevoidx/wallos-dial:${{ steps.image.outputs.tag }}
          provenance: true
