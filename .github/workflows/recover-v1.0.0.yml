# One-time recovery for the 1.0.0 tag workflow's Linux fixture ownership error.
# The tested runtime files must match the immutable tag. The published image is
# built from that tag, never from this follow-up test-harness commit.
name: Recover pinned v1.0.0 image
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  recover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm the frozen application source
        run: |
          test "$(git rev-parse 'refs/tags/v1.0.0^{commit}')" = 'd1eb9d2e4ea6f73ddef866e1508a98da40dccd93'
          test "$(cat VERSION)" = '1.0.0'
          git merge-base --is-ancestor refs/tags/v1.0.0 HEAD
          git diff --quiet refs/tags/v1.0.0 HEAD -- \
            .dockerignore Dockerfile VERSION WALLOS_VERSION compose.yaml compat theme demo
      - name: Verify the candidate with repaired disposable Linux fixtures
        run: ./scripts/verify-1.0-candidate.sh wallos-dial:preflight
      - name: Select the exact immutable release source
        run: |
          git checkout --detach refs/tags/v1.0.0
          test "$(git rev-parse HEAD)" = 'd1eb9d2e4ea6f73ddef866e1508a98da40dccd93'
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the original 1.0.0 source
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lukevoidx/wallos-dial:1.0.0
          provenance: true
